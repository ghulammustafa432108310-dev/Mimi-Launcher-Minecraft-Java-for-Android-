name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Bypass Resource Errors
      run: |
        echo "android.bundle.enableUncompressedNativeLibs=false" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew app_pojavlauncher:assembleRelease -x lint -x lintVitalRelease -Pandroid.experimental.disableCompileSdkVersionCheck=true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MimiLauncher-Custom-APK
        path: app_pojavlauncher/build/outputs/apk/release/*.apk
