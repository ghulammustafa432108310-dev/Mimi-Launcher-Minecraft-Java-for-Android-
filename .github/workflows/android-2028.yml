name: Android Java CI 2026

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Repository ka code fetch karne ke liye
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Minecraft Java wrapper ke liye JDK setup (Aap ke project ki requirement)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: gradle

    # 3. Gradle scripts ko execution permissions dene ke liye
    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    # 4. Java aur Android dependencies download aur compile karne ke liye
    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace
