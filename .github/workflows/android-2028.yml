name: Android Java CI 2026

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: gradle

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    # Yahan par yeh safe step add ho raha hai:
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Launcher-APK
        path: app_pojavlauncher/build/outputs/apk/debug/*.apk
